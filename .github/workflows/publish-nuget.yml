name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore FileBasedApp/FileBasedApp.csproj
    
    - name: Build
      run: dotnet build FileBasedApp/FileBasedApp.csproj -c Release --no-restore
    
    - name: Pack
      shell: bash
      env:
        VERSION_INPUT: ${{ github.event.inputs.version }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          release) VERSION=${GITHUB_REF#refs/tags/v} ;;
          workflow_dispatch) VERSION=$VERSION_INPUT ;;
          *) echo "Unsupported version source" >&2; exit 1 ;;
        esac

        # Three-part SemVer, with optional prerelease and build metadata.
        # Numeric core/prerelease identifiers cannot have leading zeroes.
        number='(0|[1-9][0-9]*)'
        prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        metadata='[0-9A-Za-z-]+'
        version_pattern="^${number}\.${number}\.${number}(-${prerelease}(\.${prerelease})*)?(\+${metadata}(\.${metadata})*)?$"
        if [[ ! $VERSION =~ $version_pattern ]]; then
          echo "Invalid package version: expected MAJOR.MINOR.PATCH with optional SemVer prerelease/build metadata" >&2
          exit 1
        fi

        dotnet pack FileBasedApp/FileBasedApp.csproj -c Release --no-build -o ./artifacts "/p:PackageVersion=$VERSION"
    
    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
